name = "food-recipe-api"
main = "src/worker.js"
compatibility_date = "2026-10-28"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://jeehjung.github.io"

[[d1_databases]]
binding = "DB"
database_name = "food-recipe-jobs"
database_id = "7f192050-d082-434f-b087-9dd6b92b2f07"

[[queues.producers]]
binding = "RECIPE_QUEUE"
queue = "food-recipe-jobs"

[[queues.consumers]]
queue = "food-recipe-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "food-recipe-dead-letter"

[triggers]
crons = ["0 * * * *"]

# Development environment: deploy with "npx wrangler deploy --env development".
# Create the separate D1 database and Queues before deploying, then replace the D1 ID.
[env.development]
name = "food-recipe-api-dev"

[env.development.vars]
ALLOWED_ORIGINS = "https://food-dev.pages.dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "food-recipe-jobs-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"

[[env.development.queues.producers]]
binding = "RECIPE_QUEUE"
queue = "food-recipe-jobs-dev"

[[env.development.queues.consumers]]
queue = "food-recipe-jobs-dev"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "food-recipe-dead-letter-dev"
