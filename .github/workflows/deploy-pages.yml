name: Deploy Cloudflare Pages

# 프런트엔드(index.html, PWA manifest·서비스 워커·아이콘)를 Cloudflare Pages에 직접 업로드합니다.
# main → recipe (운영), develop → recipe-dev (개발)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare static files
        run: mkdir -p dist && cp -r index.html manifest.webmanifest sw.js icons dist/

      - name: Mark development app name
        if: github.ref == 'refs/heads/develop'
        # 개발 주소에 설치한 앱은 이름 뒤에 '개발'을 붙여 운영 앱과 구분합니다.
        run: |
          sed -i 's/"name": "핫한 레시피 찾기"/"name": "핫한 레시피 찾기 개발"/; s/"short_name": "레시피"/"short_name": "레시피 개발"/' dist/manifest.webmanifest
          sed -i 's/apple-mobile-web-app-title" content="레시피"/apple-mobile-web-app-title" content="레시피 개발"/' dist/index.html
          grep -q '"short_name": "레시피 개발"' dist/manifest.webmanifest
          grep -q 'content="레시피 개발"' dist/index.html

      - name: Deploy to Cloudflare Pages
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then PROJECT=recipe; else PROJECT=recipe-dev; fi
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
